version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: membera-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: membera_auth
    ports:
      - "5432:5432"
    volumes:
      - membera-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: membera-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7-alpine
    container_name: membera-redis
    ports:
      - "6379:6379"

  minio:
    # Docker Hub's minio/minio repo now denies anonymous/public pulls
    # ("pull access denied ... requires docker login"). MinIO still publishes
    # the same image to quay.io, which allows anonymous pulls.
    image: quay.io/minio/minio:latest
    container_name: membera-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - membera-minio-data:/data
    command: server /data --console-address ":9001"

  auth-api:
    build:
      context: ./src
      dockerfile: Services/Auth/Membera.Auth.Api/Dockerfile
    container_name: membera-auth-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - ConnectionStrings__AuthDb=Host=postgres;Port=5432;Database=membera_auth;Username=postgres;Password=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
    depends_on:
      - postgres
      - rabbitmq

  merchant-api:
    build:
      context: ./src
      dockerfile: Services/Merchant/Membera.Merchant.Api/Dockerfile
    container_name: membera-merchant-api
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - ConnectionStrings__MerchantDb=Host=postgres;Port=5432;Database=membera_merchant;Username=postgres;Password=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis:6379
      - MINIO_HOST=minio:9000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - minio

  gateway:
    build:
      context: ./src
      dockerfile: gateway/Membera.Gateway/Dockerfile
    container_name: membera-gateway
    ports:
      - "7174:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AUTH_SERVICE_URL=http://auth-api:8080
      - MERCHANT_SERVICE_URL=http://merchant-api:8080
      - GATEWAY_CERT_PATH=/https/gateway.pfx
      - GATEWAY_CERT_PASSWORD=${GATEWAY_CERT_PASSWORD}
      - FRONTEND_ORIGINS=http://localhost:3000;http://localhost:5173
    volumes:
      # Dev certificate, generated locally - see certs/README.md.
      - ./certs:/https:ro
    depends_on:
      - auth-api
      - merchant-api

  frontend:
    build:
      context: ./../membera-frontend
      dockerfile: Dockerfile
    container_name: membera-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  membera-postgres-data:
  membera-minio-data:
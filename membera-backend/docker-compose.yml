version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: membera-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: membera_auth
    ports:
      - "5432:5432"
    volumes:
      - membera-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: membera-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7-alpine
    container_name: membera-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: membera-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - membera-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  membera-postgres-data:
  membera-minio-data:
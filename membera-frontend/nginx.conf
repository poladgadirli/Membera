# Replaces nginx's default.conf. Serves the Vite build and falls back to
# index.html for client-side (react-router) routes like /login, so deep links
# and refreshes load the app instead of a 404.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
